<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <link rel="icon" href="data:,">
  <title>東方紅魔郷 〜 the Embodiment of Scarlet Devil</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
    html{--touhou-canvas-width:640px;--touhou-canvas-height:480px}
    body{display:grid;place-items:center;touch-action:none}
    canvas{display:block;width:var(--touhou-canvas-width)!important;height:var(--touhou-canvas-height)!important;max-width:none;max-height:none;aspect-ratio:4/3;outline:0;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
    #status{position:fixed;inset:auto 0 1rem;text-align:center;color:#ddd;font:14px sans-serif;pointer-events:none}
  </style>
</head>
<body>
  <canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
  <div id="status">Loading…</div>
  <script>
    (() => {
      "use strict";
      const protocol = "eagler-touhou/1";
      const game = "th06";
      const saveRoot = "/savesth06";
      const params = new URLSearchParams(location.search);
      const hosted = params.get("hosted") === "1" && window.parent !== window;
      const assetVersion = params.get("v") || "";
      const gameDataVersion = params.get("asset") || "";
      const oggAssetVersion = params.get("oggAsset") || "";
      const nativeFetch = globalThis.fetch.bind(globalThis);
      const localGameDataUrl = gameDataVersion
        ? new URL(`/.eagler-local/game-data/${game}/${encodeURIComponent(gameDataVersion)}/${game}.data`, location.origin).href
        : "";
      globalThis.fetch = async (input, init) => {
        try {
          const requestUrl = new URL(input instanceof Request ? input.url : String(input), location.href);
          const method = String(input instanceof Request ? input.method : (init?.method || "GET")).toUpperCase();
          if (localGameDataUrl && method === "GET" && requestUrl.origin === location.origin &&
              requestUrl.pathname.endsWith(`/${game}.data`) && globalThis.caches?.match) {
            const local = await caches.match(localGameDataUrl);
            if (local) return local.clone();
          }
          if (oggAssetVersion && method === "GET" && requestUrl.origin === location.origin &&
              /\/[^/]+\.ogg$/i.test(requestUrl.pathname) && globalThis.caches?.match) {
            const filename = decodeURIComponent(requestUrl.pathname.slice(requestUrl.pathname.lastIndexOf("/") + 1));
            if (/^[A-Za-z0-9_.-]+\.ogg$/.test(filename)) {
              const localOgg = new URL(`/.eagler-local/ogg/${game}/${encodeURIComponent(oggAssetVersion)}/${encodeURIComponent(filename)}`, location.origin).href;
              const local = await caches.match(localOgg);
              if (local) return local.clone();
            }
          }
        } catch {}
        return nativeFetch(input, init);
      };
      const mobileDevice = navigator.userAgentData?.mobile === true || /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) ||
        (navigator.maxTouchPoints > 1 && /Macintosh/i.test(navigator.userAgent));
      const status = document.getElementById("status");
      const containCanvasSize = (width, height) => {
        const safeWidth = Math.max(1, Math.floor(Number(width) || 0));
        const safeHeight = Math.max(1, Math.floor(Number(height) || 0));
        let cssWidth = safeWidth;
        let cssHeight = Math.floor(cssWidth * 3 / 4);
        if (cssHeight > safeHeight) {
          cssHeight = safeHeight;
          cssWidth = Math.floor(cssHeight * 4 / 3);
        }
        return { width: cssWidth, height: cssHeight };
      };
      const fitCanvasToViewport = () => {
        const root = document.documentElement;
        if (!root) return;
        const size = containCanvasSize(root.clientWidth, root.clientHeight);
        root.style.setProperty("--touhou-canvas-width", `${size.width}px`);
        root.style.setProperty("--touhou-canvas-height", `${size.height}px`);
      };
      fitCanvasToViewport();
      window.addEventListener("resize", fitCanvasToViewport, { passive: true });
      window.visualViewport?.addEventListener("resize", fitCanvasToViewport, { passive: true });
      let launched = false;
      let loadedMusicFiles = [];
      let loadedRuntimeFiles = [];
      let thpracCatalog = [];
      const failedMusicResources = new Map();
      let transfer = null;
      let baseTransfer = null;

      const reply = (request, ok, payload = {}) => {
        if (!hosted) return;
        window.parent.postMessage({ protocol, game, request, ok, ...payload }, location.origin);
      };
      const emit = (event, payload = {}) => {
        if (hosted) window.parent.postMessage({ protocol, game, event, ...payload }, location.origin);
      };
      globalThis.EaglerTouhouGameExited = result => emit("exit", { status: result === 1 ? "success" : "failure" });

      const sync = () => new Promise((resolve, reject) => {
        FS.syncfs(false, error => error ? reject(error) : resolve());
      });

      const safePath = value => {
        if (typeof value !== "string" || !value || value.includes("\\")) throw new Error("invalid path");
        const parts = value.split("/");
        if (parts.some(part => !part || part === "." || part === "..")) throw new Error("invalid path");
        return `${saveRoot}/${parts.join("/")}`;
      };

      const ensureDir = path => {
        const slash = path.lastIndexOf("/");
        if (slash > 0) FS.mkdirTree(path.slice(0, slash));
      };

      const clearMusic = () => {
        for (const path of loadedMusicFiles) {
          try { FS.unlink(path); } catch {}
        }
        loadedMusicFiles = [];
      };
      const clearRuntime = () => {
        for (const path of loadedRuntimeFiles) { try { FS.unlink(path); } catch {} }
        loadedRuntimeFiles = [];
      };
      const assertStaticPackManifest = (manifest, expected) => {
        if (manifest?.schema !== "eagler-touhou/thcrap-static-pack/1" || manifest.game !== "th06" ||
            manifest.language !== expected.language || manifest.runtimeVersion !== expected.runtimeVersion ||
            !Array.isArray(manifest.files) || manifest.files.length > 256) throw new Error("invalid TH06 language pack manifest");
        for (const file of manifest.files) {
          if (typeof file?.path !== "string" || !file.path.startsWith("/thcrap/th06/") || file.path.includes("\\") || file.path.includes("..") ||
              !Number.isInteger(file.bytes) || file.bytes < 0) throw new Error("invalid TH06 language pack file");
        }
      };
      const installStaticPack = async pack => {
        if (launched) throw new Error("runtime resources cannot be changed after launch");
        if (typeof pack?.url !== "string" || typeof pack.language !== "string" || typeof pack.runtimeVersion !== "string" ||
            !Number.isInteger(pack.bytes) || pack.bytes <= 0 ||
            !pack.manifest || !Array.isArray(pack.files)) throw new Error("invalid TH06 language pack");
        const url = new URL(pack.url, location.href);
        if (url.origin !== location.origin) throw new Error("cross-origin TH06 language pack");
        assertStaticPackManifest(pack.manifest, pack);
        const expected = new Map(pack.manifest.files.map(file => [file.path, file]));
        if (pack.files.length !== expected.size) throw new Error("TH06 language pack file count mismatch");
        const verified = [];
        for (const file of pack.files) {
          if (typeof file?.path !== "string" || !file.path.startsWith("/thcrap/th06/") || file.path.includes("\\") || file.path.includes("..") ||
              !(file.bytes instanceof Uint8Array)) throw new Error("invalid TH06 language pack path");
          const declaration = expected.get(file.path);
          if (!declaration || file.bytes.length !== declaration.bytes) throw new Error(`${file.path}: size mismatch`);
          verified.push({ path: file.path, bytes: file.bytes });
        }
        clearRuntime();
        for (const file of verified) {
          ensureDir(file.path); FS.writeFile(file.path, file.bytes, { canOwn: true }); loadedRuntimeFiles.push(file.path);
        }
      };
      const installRuntime = async message => {
        if (launched) throw new Error("runtime resources cannot be changed after launch");
        if (message.runtimePack) { await installStaticPack(message.runtimePack); return; }
        const resources = message.runtimeResources ?? [];
        if (!Array.isArray(resources) || resources.length > 256) throw new Error("invalid runtime resources");
        clearRuntime();
        for (const resource of resources) {
          if (typeof resource?.url !== "string" || typeof resource.path !== "string" || !resource.path.startsWith("/thcrap/th06/") || resource.path.includes("\\") || resource.path.includes("..")) throw new Error("invalid runtime resource");
          const url = new URL(resource.url, location.href);
          if (url.origin !== location.origin) throw new Error("cross-origin runtime resource");
          const response = await fetch(url, { cache: "force-cache" });
          if (!response.ok) throw new Error(`${url.pathname}: HTTP ${response.status}`);
          const bytes = new Uint8Array(await response.arrayBuffer());
          if (Number.isFinite(Number(resource.size)) && bytes.length !== Number(resource.size)) throw new Error(`${resource.path}: size mismatch`);
          ensureDir(resource.path); FS.writeFile(resource.path, bytes, { canOwn: true }); loadedRuntimeFiles.push(resource.path);
        }
      };

      const installShared = async message => {
        if (!Array.isArray(message.sharedResources) || message.sharedResources.length > 4) throw new Error("invalid shared resources");
        await Promise.all(message.sharedResources.map(async resource => {
          if (typeof resource?.url !== "string" || !["/msgothic.ttc", "/unifont.otf"].includes(resource.path)) throw new Error("invalid shared resource");
          const url = new URL(resource.url, location.href);
          if (url.origin !== location.origin) throw new Error("cross-origin shared resource");
          const response = await fetch(url, { cache: "force-cache" });
          if (!response.ok) throw new Error(`${url.pathname}: HTTP ${response.status}`);
          FS.writeFile(resource.path, new Uint8Array(await response.arrayBuffer()), { canOwn: true });
        }));
      };

      const emitTransfer = force => {
        if (!transfer) return;
        const now = performance.now();
        if (!force && now - transfer.lastEmit < 200) return;
        transfer.lastEmit = now;
        const seconds = Math.max((now - transfer.startedAt) / 1000, 0.1);
        emit("transfer", {
          kind: "music", mode: transfer.mode, loaded: transfer.loaded, total: transfer.total,
          speed: transfer.loaded / seconds, completed: transfer.completed, files: transfer.files
        });
      };

      const downloadMusicResource = async resource => {
        if (typeof resource?.url !== "string" || typeof resource?.path !== "string" ||
            !/^\/bgm\/[A-Za-z0-9_.-]+$/.test(resource.path)) throw new Error("invalid music resource");
        const url = new URL(resource.url, location.href);
        if (url.origin !== location.origin) throw new Error("cross-origin music resource");
        const previous = transfer.byPath.get(resource.path) || 0;
        transfer.loaded = Math.max(0, transfer.loaded - previous);
        transfer.byPath.set(resource.path, 0);
        const response = await fetch(url, { cache: "force-cache" });
        if (!response.ok) throw new Error(`${url.pathname}: HTTP ${response.status}`);
        const declared = Number(resource.size) || Number(response.headers.get("content-length")) || 0;
        if (!Number(resource.size) && declared) transfer.total += declared;
        const chunks = [];
        let received = 0;
        if (response.body) {
          const reader = response.body.getReader();
          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            chunks.push(value); received += value.length; transfer.loaded += value.length;
            transfer.byPath.set(resource.path, received); emitTransfer(false);
          }
        } else {
          const value = new Uint8Array(await response.arrayBuffer());
          chunks.push(value); received = value.length; transfer.loaded += value.length;
          transfer.byPath.set(resource.path, received);
        }
        const bytes = new Uint8Array(received);
        let offset = 0;
        for (const chunk of chunks) { bytes.set(chunk, offset); offset += chunk.length; }
        ensureDir(resource.path); FS.writeFile(resource.path, bytes, { canOwn: true });
        loadedMusicFiles.push(resource.path); failedMusicResources.delete(resource.path);
        transfer.completed++; emitTransfer(true);
      };

      const recordMusicFailure = (resource, error) => {
        failedMusicResources.set(resource.path, resource);
        emit("music-error", { path: resource.path, error: String(error?.message || error), failed: failedMusicResources.size });
      };

      const runMusicQueue = async resources => {
        let next = 0;
        const worker = async () => {
          while (next < resources.length) {
            const resource = resources[next++];
            try { await downloadMusicResource(resource); } catch (error) { recordMusicFailure(resource, error); }
          }
        };
        await Promise.all(Array.from({ length: Math.min(4, resources.length) }, worker));
      };

      const retryMusic = async () => {
        const resources = [...failedMusicResources.values()];
        failedMusicResources.clear();
        await runMusicQueue(resources);
        if (!failedMusicResources.size) emit("music-complete", { loaded: transfer?.loaded || 0, total: transfer?.total || 0 });
      };

      const installMusic = async message => {
        if (launched) throw new Error("music cannot be changed after launch");
        const options = message.options || {};
        if (!Array.isArray(message.thpracCatalog ?? []) || (message.thpracCatalog?.length || 0) > 256) throw new Error("invalid thprac catalog");
        thpracCatalog = message.thpracCatalog ?? [];
        Module.eaglerThpracCatalog = thpracCatalog;
        for (const key of ["thpracEnabled", "limitPresentationTo60", "touchEnabled", "unlimitedTouch", "touchBombZoneEnabled", "doubleTapBombEnabled", "alwaysHitbox", "th06FocusHitbox"]) {
          if (options[key] != null && typeof options[key] !== "boolean") throw new Error("invalid eagler-touhou option");
        }
        if (options.touchSensitivity != null && (!Number.isFinite(options.touchSensitivity) || options.touchSensitivity < 50 || options.touchSensitivity > 300)) throw new Error("invalid touch sensitivity");
        if (options.touchMovementMode != null && !["joystick", "joystick-free", "touch", "touch-unlimited"].includes(options.touchMovementMode)) throw new Error("invalid touch movement mode");
        if (options.touchFocusMode != null && !["two-finger", "hold-button", "toggle-button"].includes(options.touchFocusMode)) throw new Error("invalid touch focus mode");
        if (options.thpracLocale != null && !["zh-CN", "ja-JP", "en-US"].includes(options.thpracLocale)) throw new Error("invalid thprac locale");
        const session = options.thpracSession;
        if (options.debugHarness != null && ![
          "thprac-menu", "music-room", "font-metrics", "stage1",
          "ending-reimu-a", "ending-reimu-b", "ending-marisa-a", "ending-marisa-b",
          "ending-reimu-bad", "ending-marisa-bad"
        ].includes(options.debugHarness)) throw new Error("invalid debug harness");
        if (session != null && (session.schema !== "eagler-touhou/thprac-session/1" || session.game !== "th06" || typeof session.params !== "object" || !session.params)) throw new Error("invalid thprac session");
        Module.eaglerOptions = {
          thpracEnabled: !!options.thpracEnabled,
          limitPresentationTo60: !!options.limitPresentationTo60,
          touchEnabled: !!options.touchEnabled,
          touchMovementMode: options.touchMovementMode || "touch",
          touchSensitivity: options.touchSensitivity ?? 100,
          touchFocusMode: options.touchFocusMode || "two-finger",
          unlimitedTouch: !!options.touchEnabled && (options.touchMovementMode === "touch-unlimited" || !!options.unlimitedTouch),
          touchBombZoneEnabled: options.touchBombZoneEnabled !== false,
          doubleTapBombEnabled: !!options.touchEnabled && !!options.doubleTapBombEnabled,
          alwaysHitbox: !!options.alwaysHitbox,
          th06FocusHitbox: !!options.th06FocusHitbox,
          thpracLocale: options.thpracLocale || "en-US",
          debugHarness: options.debugHarness || null,
          thpracSession: session || null
        };
        if (!["midi", "wav", "ogg"].includes(message.music)) throw new Error("invalid music mode");
        if (!Array.isArray(message.resources) || message.resources.length > 64) throw new Error("invalid music resources");
        clearMusic();
        failedMusicResources.clear();
        Module.touhouMusicMode = message.music;
        if (message.music === "midi") return;
        transfer = {
          mode: message.music, loaded: 0,
          total: message.resources.reduce((sum, resource) => sum + (Number(resource.size) || 0), 0),
          completed: 0, files: message.resources.length, startedAt: performance.now(), lastEmit: 0,
          byPath: new Map()
        };
        emitTransfer(true);
        if (message.music === "ogg") {
          await runMusicQueue(message.resources.slice(0, 2));
          runMusicQueue(message.resources.slice(2)).then(() => {
            emit(failedMusicResources.size ? "music-incomplete" : "music-complete",
              { loaded: transfer.loaded, total: transfer.total, failed: failedMusicResources.size });
          });
        } else {
          await runMusicQueue(message.resources);
          if (failedMusicResources.size) {
            clearMusic(); Module.touhouMusicMode = "";
            throw new Error(`${failedMusicResources.size} music resources failed`);
          }
          emit("music-complete", { loaded: transfer.loaded, total: transfer.total });
        }
        status.textContent = "Ready";
      };

      const walk = (path, output = []) => {
        for (const name of FS.readdir(path)) {
          if (name === "." || name === "..") continue;
          const child = `${path}/${name}`;
          const stat = FS.stat(child);
          if (FS.isDir(stat.mode)) walk(child, output);
          else output.push({ path: child.slice(saveRoot.length + 1), size: stat.size });
        }
        return output;
      };

      const launch = () => {
        if (launched) return;
        const start = session => {
          if (launched) return;
          Module.eaglerOptions.thpracSession = session;
          if (session) emit("thprac-session", { session });
          launched = true; status.textContent = ""; Module.callMain([]); document.getElementById("canvas").focus();
        };
        start(Module.eaglerOptions.thpracSession || null);
      };

      // Browser/Emscripten keyboard delivery is not uniform across Edge IME
      // paths, Bluetooth keyboards and tablet external keyboards. Keep SDL as
      // the primary input source, but mirror recognized physical game keys in
      // a tiny host-owned bitset that Controller::GetInput ORs with SDL state.
      const browserKeyboardDown = new Map();
      const thpracKeyboardDown = new Map();
      const thpracKeyboardBitForEvent = event => {
        switch (event.code || "") {
        case "Backspace": return 1 << 0;
        case "F1": return 1 << 1;
        case "F2": return 1 << 2;
        case "F3": return 1 << 3;
        case "F4": return 1 << 4;
        case "F5": return 1 << 5;
        case "F6": return 1 << 6;
        case "F7": return 1 << 7;
        }
        const key = String(event.key || "").toLowerCase();
        if (key === "backspace") return 1 << 0;
        if (/^f[1-7]$/.test(key)) return 1 << Number(key.slice(1));
        const keyCode = Number(event.keyCode) || 0;
        if (keyCode === 8) return 1 << 0;
        if (keyCode >= 112 && keyCode <= 118) return 1 << (keyCode - 111);
        return 0;
      };
      const keyboardBitForEvent = event => {
        switch (event.code || "") {
        case "KeyZ": return 1 << 0;
        case "KeyX": return 1 << 1;
        case "ShiftLeft": case "ShiftRight": return 1 << 2;
        case "Escape": return 1 << 3;
        case "ArrowUp": case "Numpad8": return 1 << 4;
        case "ArrowDown": case "Numpad2": return 1 << 5;
        case "ArrowLeft": case "Numpad4": return 1 << 6;
        case "ArrowRight": case "Numpad6": return 1 << 7;
        case "Numpad7": return (1 << 4) | (1 << 6);
        case "Numpad9": return (1 << 4) | (1 << 7);
        case "Numpad1": return (1 << 5) | (1 << 6);
        case "Numpad3": return (1 << 5) | (1 << 7);
        case "ControlLeft": case "ControlRight": return 1 << 8;
        case "KeyQ": return 1 << 9;
        case "KeyS": return 1 << 10;
        case "Home": return 1 << 11;
        case "Enter": case "NumpadEnter": return 1 << 12;
        case "KeyR": return 1 << 13;
        }
        const key = String(event.key || "").toLowerCase();
        if (key === "z") return 1 << 0;
        if (key === "x") return 1 << 1;
        if (key === "shift") return 1 << 2;
        if (key === "escape" || key === "esc") return 1 << 3;
        if (key === "arrowup") return 1 << 4;
        if (key === "arrowdown") return 1 << 5;
        if (key === "arrowleft") return 1 << 6;
        if (key === "arrowright") return 1 << 7;
        if (key === "control") return 1 << 8;
        if (key === "q") return 1 << 9;
        if (key === "s") return 1 << 10;
        if (key === "home") return 1 << 11;
        if (key === "enter") return 1 << 12;
        if (key === "r") return 1 << 13;
        // Legacy DOM keyCode fallback for older/vendor Android WebViews. Do
        // not map raw Android KEYCODE_DPAD_* 19..22 here: Chromium converts
        // those to DOM Arrow* before exposing the event, and 19/20 already
        // have unrelated legacy Web meanings.
        switch (Number(event.keyCode) || 0) {
        case 90: return 1 << 0;  // Z
        case 88: return 1 << 1;  // X
        case 16: return 1 << 2;  // Shift
        case 27: return 1 << 3;  // Escape
        case 38: return 1 << 4;  // Up
        case 40: return 1 << 5;  // Down
        case 37: return 1 << 6;  // Left
        case 39: return 1 << 7;  // Right
        case 17: return 1 << 8;  // Control
        case 81: return 1 << 9;  // Q
        case 83: return 1 << 10; // S
        case 36: return 1 << 11; // Home
        case 13: return 1 << 12; // Enter
        case 82: return 1 << 13; // R
        }
        return 0;
      };
      const publishBrowserKeyboard = () => {
        let bits = 0;
        for (const value of browserKeyboardDown.values()) bits |= value;
        let thpracBits = 0;
        for (const value of thpracKeyboardDown.values()) thpracBits |= value;
        if (Module.eaglerControls) {
          Module.eaglerControls.keyboardBits = bits;
          Module.eaglerControls.thpracKeyboardBits = thpracBits;
        }
      };
      const applyBrowserKeyboardEvent = (event, down) => {
        const bit = keyboardBitForEvent(event);
        const thpracBit = thpracKeyboardBitForEvent(event);
        if (!bit && !thpracBit) return false;
        // Some external/mobile keyboards report code=KeyZ on DOWN and
        // code=Unidentified on UP. The mapped logical bit is stable across
        // both events; location still separates left/right modifier owners.
        if (bit) {
          const id = `${bit}:${event.location || 0}`;
          if (down) {
            browserKeyboardDown.set(id, bit);
          } else {
            const hadDownOwner = browserKeyboardDown.delete(id);
            if (!hadDownOwner && Module.eaglerControls)
              Module.eaglerControls.keyboardPulseBits = (Module.eaglerControls.keyboardPulseBits | 0) | bit;
          }
        }
        const thpracId = `${thpracBit}:${event.location || 0}`;
        if (thpracBit) {
          if (down) thpracKeyboardDown.set(thpracId, thpracBit);
          else thpracKeyboardDown.delete(thpracId);
        }
        publishBrowserKeyboard();
        return true;
      };
      const clearBrowserKeyboard = () => {
        browserKeyboardDown.clear();
        thpracKeyboardDown.clear();
        if (Module.eaglerControls) {
          Module.eaglerControls.keyboardBits = 0;
          Module.eaglerControls.keyboardPulseBits = 0;
          Module.eaglerControls.thpracKeyboardBits = 0;
        }
      };
      window.addEventListener("keydown", event => {
        if (!launched) return;
        if (event.metaKey || event.altKey) return;
        if (applyBrowserKeyboardEvent(event, true)) event.preventDefault();
      }, true);
      window.addEventListener("keyup", event => {
        if (!launched) return;
        if (event.metaKey || event.altKey) return;
        if (applyBrowserKeyboardEvent(event, false)) event.preventDefault();
      }, true);

      window.addEventListener("message", async event => {
        if (!hosted || event.source !== window.parent || event.origin !== location.origin) return;
        const message = event.data || {};
        if (message.protocol !== protocol || message.game !== game) return;
        try {
          switch (message.command) {
          case "configure":
            await installShared(message);
            await installRuntime(message);
            await installMusic(message);
            reply(message.request, true);
            break;
          case "keyboard":
            if (typeof message.down !== "boolean" || typeof message.code !== "string" || typeof message.key !== "string" ||
                !Number.isInteger(message.keyCode) || !Number.isInteger(message.location))
              throw new Error("invalid keyboard bridge event");
            applyBrowserKeyboardEvent(message, message.down);
            break;
          case "keyboard-clear": clearBrowserKeyboard(); break;
          case "touch-cancel": cancelAllTouches(); reply(message.request, true); break;
          case "thprac-mouse":
            if (!["move", "down", "up"].includes(message.type) || !Number.isFinite(message.x) || !Number.isFinite(message.y))
              throw new Error("invalid thprac mouse bridge event");
            const mouseRect = Module.canvas.getBoundingClientRect();
            if (!(mouseRect.width > 0) || !(mouseRect.height > 0)) break;
            const mouseX = (message.x - mouseRect.left) * 640 / mouseRect.width;
            const mouseY = (message.y - mouseRect.top) * 480 / mouseRect.height;
            Module.canvas.focus({ preventScroll: true });
